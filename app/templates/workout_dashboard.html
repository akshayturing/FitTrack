<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="user-id" content="{{ user.id }}">
<title>
Your Workouts - FitTrack

</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Component CSS -->
<link href="{{ url_for('static', filename='css/components/cards.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='css/components/badges.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='css/components/filters.css') }}" rel="stylesheet">
<!-- Page CSS -->
<link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
</head>
<body>
<div>
<h1>
Your Workout Dashboard

</h1>
    <!-- Filters Section - Include from partial template -->
    {% include 'dashboard/_filters.html' %}
    
    <!-- Workout List -->
    <div id="workoutList" class="row">
        <!-- Workouts will be loaded here dynamically -->
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Application scripts -->
<script src="{{ url_for('static', filename='js/dashboard/utils.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard/ui-states.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard/filters.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard/workout-cards.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard-main.js') }}"></script>
</body>
</html>
